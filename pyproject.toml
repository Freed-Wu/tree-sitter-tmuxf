[build-system]
requires = ["setuptools>=62.4.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tree-sitter-tmuxf"
description = "🌲👨 tmux format ststring grammar for tree-sitter "
version = "0.0.1"
keywords = ["incremental", "parsing", "tree-sitter", "tmuxf"]
classifiers = [
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Compilers",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]
authors = [{ name = "Wu", email = "wuzhenyu@ustc.edu" }]
requires-python = ">=3.10"
license.text = "MIT"
readme = "README.md"

[project.urls]
Homepage = "https://github.com/freed-wu/tree-sitter-tmux"
Funding = "https://github.com/Freed-Wu/tree-sitter-tmux"

[project.optional-dependencies]
core = ["tree-sitter~=0.24"]

[tool.cibuildwheel]
build = "cp310-*"
build-frontend = "build"
